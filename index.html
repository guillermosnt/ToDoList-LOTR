<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Misión del Día</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Misión">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Cinzel Decorative','Cinzel',Georgia,serif; --title:'Cinzel',Georgia,serif; --body:'IM Fell English','Palatino Linotype',Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{--bg:#2b1208;--g1:#f6dd8a;--g2:#d4a72c;--g3:#8a6a14;--accent:#e8731c;--glow:#c0391b;--ember:232,115,28;--far:#1c0e09;--near:#0d0705;--dim:#a89a74;--txt:#eadcb4;
  margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -5%,var(--bg) 0%,transparent 60%),#0b0c0a;color:var(--txt);font:19px/1.5 var(--body);overflow-x:hidden;transition:background .8s}
body[data-t=lorien]{--bg:#1a3320;--g1:#eef3c4;--g2:#c9c27a;--g3:#7d7a3c;--accent:#b9e07a;--glow:#6fbf5a;--ember:185,224,122;--far:#10261a;--near:#08130c;--dim:#97a58b;--txt:#e6ecd2}
body[data-t=gondor]{--bg:#1d2a3d;--g1:#ffffff;--g2:#cfd9e6;--g3:#7e8da1;--accent:#bcd6f2;--glow:#6f9ad0;--ember:188,214,242;--far:#18222f;--near:#0b1119;--dim:#98a4b3;--txt:#e8eef6}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.mtn{position:fixed;left:0;right:0;bottom:0;height:170px;width:100%;pointer-events:none;z-index:0}
.mtn .far{fill:var(--far);transition:fill .8s}.mtn .near{fill:var(--near);transition:fill .8s}
.doom{position:fixed;right:-30px;bottom:70px;width:220px;height:140px;background:radial-gradient(ellipse at 50% 100%,var(--glow),transparent 65%);opacity:.55;filter:blur(8px);pointer-events:none;z-index:0;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.9;transform:scale(1.08)}}
.note{position:relative;z-index:2;text-align:center;font:600 12px var(--title);letter-spacing:.1em;color:var(--dim);padding:8px;border-bottom:1px solid #3a2f1a;background:rgba(0,0,0,.35)}
main{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:16px 16px 190px}

/* El Anillo se enciende */
.hero{text-align:center}
.ring{width:156px;height:156px;margin:0 auto;cursor:pointer;filter:drop-shadow(0 0 16px rgba(var(--ember),.55));animation:glow 5s ease-in-out infinite}
.ring svg{width:100%;height:100%;overflow:visible}
.rt{transform-origin:100px 100px;animation:spin 70s linear infinite}
.rt text{animation:ignite 3.2s ease-out .3s both}
@keyframes ignite{0%{fill:#fff;opacity:0}25%{fill:#fff6c0;opacity:1}100%{fill:rgb(var(--ember));opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 30px rgba(var(--ember),.9))}}
.ring.flare{animation:flare .9s ease-out}
@keyframes flare{30%{transform:scale(1.14);filter:drop-shadow(0 0 44px #fff3b0)}}
h1{font:700 clamp(27px,8.4vw,36px)/1.1 var(--display);margin:8px 0 4px;letter-spacing:.03em;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.date{font:500 13px var(--title);letter-spacing:.16em;color:var(--dim);margin:0;text-transform:capitalize}
.orn{display:block;width:150px;height:14px;margin:14px auto}
.orn *{stroke:var(--g2);fill:none;stroke-width:1}.orn .lf{fill:var(--g3)}

/* Camino a la Montaña del Destino */
.journey{padding:0 30px;margin:2px 0 8px}
.jt{font:600 12px var(--title);letter-spacing:.12em;color:var(--dim);text-align:center;margin:0 0 20px}
.track{position:relative;height:4px;background:#33260f;border-radius:2px;margin-bottom:34px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--g3),var(--g1));box-shadow:0 0 10px var(--accent);transition:width 1s cubic-bezier(.3,.8,.3,1)}
.stop{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#150f06;border:2px solid #5b4a2a;transition:.5s}
.stop.on{border-color:var(--g1);background:var(--g2);box-shadow:0 0 9px var(--accent)}
.stop b{position:absolute;top:19px;left:50%;transform:translateX(-50%);font:600 12px var(--title);color:var(--dim);white-space:nowrap;transition:color .5s}
.stop.on b{color:var(--g1)}
.token{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid var(--g1);box-shadow:0 0 16px var(--accent),inset 0 0 6px #000;transition:left 1s cubic-bezier(.3,.8,.3,1);z-index:2}

/* Entrada */
form{display:flex;gap:12px;align-items:flex-end}
input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--g3);color:var(--txt);font:italic 21px var(--body);padding:10px 2px;outline:none;transition:border-color .3s,box-shadow .3s}
input::placeholder{color:#7d704f}
input:focus{border-color:var(--g1);box-shadow:0 8px 14px -10px var(--accent)}
.seal-btn{flex:none;width:52px;height:52px;border-radius:50%;cursor:pointer;border:1px solid var(--g3);color:#1c1405;font:700 26px/1 var(--title);background:radial-gradient(circle at 35% 30%,var(--g1),var(--g2) 60%,var(--g3));box-shadow:0 3px 0 rgba(0,0,0,.5),0 0 16px rgba(var(--ember),.35);transition:transform .12s}
.seal-btn:active{transform:translateY(2px) scale(.96)}
:focus-visible{outline:2px solid var(--g1);outline-offset:3px}

.tabs{display:flex;justify-content:center;gap:4px;margin:6px 0 14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:600 14px var(--title);letter-spacing:.07em;padding:8px 12px;cursor:pointer;transition:.25s}
.tab[aria-selected=true]{color:var(--g1);border-color:var(--g2)}

/* Pergaminos */
ul{list-style:none;margin:0;padding:0;display:grid;gap:16px}
li{position:relative;margin:0 10px;display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;color:#2b1d0e;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .08 0 0 0 .25 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),linear-gradient(180deg,#ecdcae,#d8c28d);
  box-shadow:inset 0 0 22px rgba(110,70,20,.55),0 6px 16px rgba(0,0,0,.6);animation:unroll .5s cubic-bezier(.2,.8,.3,1);transition:filter .5s}
li::before,li::after{content:"";position:absolute;top:-3px;bottom:-3px;width:14px;border-radius:7px;background:linear-gradient(90deg,#6e5128,#e6d29c 45%,#6e5128);box-shadow:0 3px 8px rgba(0,0,0,.55)}
li::before{left:-8px}li::after{right:-8px}
li.gone{animation:vanish .4s forwards}
@keyframes unroll{from{opacity:0;transform:scaleY(.15);transform-origin:top}}
@keyframes vanish{to{opacity:0;transform:translateX(70px) rotate(2deg)}}
.seal{flex:none;width:40px;height:40px;border-radius:50%;cursor:pointer;position:relative;background:none;border:1.5px dashed #8a6e3d;transition:.3s}
.seal::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 35% 30%,#d4503f,#8e1f13 60%,#5a0f08);box-shadow:inset 0 0 0 5px #a3291b,inset 0 0 0 7px rgba(255,205,170,.5),0 2px 5px rgba(0,0,0,.5)}
.seal::before{content:"";position:absolute;inset:11px;border-radius:50%;border:3px solid rgba(255,214,170,.85);opacity:0;z-index:1;box-shadow:0 0 6px rgba(255,180,100,.6)}
.done .seal{border-color:transparent}.done .seal::after,.done .seal::before{opacity:1}
.fresh .seal::after,.fresh .seal::before{animation:stamp .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp{0%{transform:scale(2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none}}
.txt{flex:1;min-width:0;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.done{filter:saturate(.65) brightness(.9)}
.done .txt{color:#6f5a36;text-decoration:line-through;text-decoration-color:#8e1f13;text-decoration-thickness:2px}
.del{flex:none;background:none;border:0;color:#8a6e3d;font-size:24px;line-height:1;cursor:pointer;padding:4px 8px}
.del:hover{color:#8e1f13}
.empty{text-align:center;font-style:italic;color:var(--dim);padding:20px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:var(--dim);font-size:16px}
.realms{display:flex;gap:8px;align-items:center;margin-top:22px;justify-content:center;font:500 13px var(--title);color:var(--dim);letter-spacing:.06em}
.realms button{background:none;border:1px solid #4a3d22;color:var(--dim);font:600 13px var(--title);letter-spacing:.05em;padding:6px 12px;border-radius:2px;cursor:pointer;transition:.25s}
.realms button[aria-pressed=true]{color:var(--g1);border-color:var(--g2);box-shadow:0 0 12px rgba(var(--ember),.35)}
/* Victoria */
.win{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px 24px;background:rgba(4,3,5,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);cursor:pointer}
.win[hidden]{display:none}
.win.on{animation:fi .35s ease both}
.win.out{animation:fo .5s ease both}
@keyframes fi{from{opacity:0}}
@keyframes fo{to{opacity:0}}
@keyframes fadein{to{opacity:1}}
.vol{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.vol i{position:absolute;top:-140px;width:2px;border-radius:2px;opacity:0;background:linear-gradient(transparent,#f3dfa2);transform:rotate(-14deg)}
.vol i::after{content:"";position:absolute;bottom:-6px;left:-2px;border:3px solid transparent;border-top:7px solid #cfd3da;border-bottom:0}
.win.on .vol i{animation:vol var(--t) cubic-bezier(.4,0,.9,.7) var(--d) both}
@keyframes vol{from{transform:rotate(-14deg) translateY(0);opacity:0}10%{opacity:1}to{transform:rotate(-14deg) translateY(135vh);opacity:1}}
.pop{position:relative;z-index:2;width:min(100%,340px);border-radius:30px;background:#0e0c12;color:var(--txt);text-align:center;
  box-shadow:0 0 0 2px var(--g3),0 0 0 5px #1a1208,0 0 0 6px var(--g2),0 26px 60px rgba(0,0,0,.75),0 0 60px rgba(var(--ember),.3)}
.win.on .pop{animation:pop .6s cubic-bezier(.2,1.3,.4,1) .1s both}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.82)}}
.vscene{display:block;width:100%;height:auto;border-radius:28px 28px 0 0}
.pc{padding:14px 28px 38px}
.sh{position:absolute;top:-24px;width:68px;height:68px;z-index:3;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.sh.l{left:-16px}.sh.r{right:-16px}
.sh svg{display:block;width:100%;height:100%}
.win.on .sh{animation:shpop .6s cubic-bezier(.2,1.6,.4,1) var(--d) both,hit .45s ease calc(var(--d) + .75s) both;animation-fill-mode:both,none}
@keyframes shpop{from{transform:scale(0) rotate(-140deg)}}
@keyframes hit{0%{transform:none}25%{transform:rotate(-9deg) scale(1.06)}55%{transform:rotate(5deg)}100%{transform:none}}
.tw{animation:tw 3s ease-in-out var(--d) infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.hz{opacity:0}
.win.on .hz{animation:fadein 1.4s ease .2s forwards}
.win.on .fall{animation:fall .5s cubic-bezier(.5,0,.9,.6) var(--d) both}
@keyframes fall{from{transform:translateY(-190px);opacity:0}12%{opacity:1}to{transform:none;opacity:1}}
.win.on .stk{animation:stick .6s ease calc(var(--d) + .5s) both}
@keyframes stick{0%{transform:none}22%{transform:rotate(7deg)}46%{transform:rotate(-5deg)}72%{transform:rotate(2.5deg)}100%{transform:none}}
.tr{stroke:#ffd98a;stroke-width:1.2;stroke-opacity:.6}
.win.on .tr{animation:trl .75s ease var(--d) both}
@keyframes trl{0%,70%{opacity:1}100%{opacity:0}}
.vh{font:700 clamp(27px,8vw,34px)/1.12 var(--display);margin:0 0 4px;background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.vs{font-size:19px;line-height:1.35;color:var(--txt);margin:0}
.vs i{display:block;margin-top:8px;color:var(--g2);font-size:18px}
.win.on .vh{animation:title 1s cubic-bezier(.2,.8,.2,1) 1s both}
.win.on .pc .orn{animation:up .7s ease 1.3s both}
.win.on .vs{animation:up .7s ease 1.45s both}
@keyframes title{from{opacity:0;transform:scale(1.3);filter:blur(7px)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.drain{position:absolute;left:26px;right:26px;bottom:15px;height:3px;border-radius:2px;transform-origin:left;background:linear-gradient(90deg,var(--g3),var(--g1));box-shadow:0 0 8px var(--accent)}
.win.on .drain{animation:drain 2s linear 1.8s both}
@keyframes drain{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rt text{fill:rgb(var(--ember))}.hz{opacity:1}}

.link{background:none;border:0;color:var(--dim);font:inherit;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.link:hover{color:var(--g1)}
.ver{text-align:center;margin:18px 0 0;font:500 12px var(--title);letter-spacing:.1em;color:#6f6548}
.upd{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#3d2c12,#251a0b);border-bottom:1px solid var(--g2);box-shadow:0 6px 18px rgba(0,0,0,.6);font:600 14px var(--title);color:var(--g1);animation:slidedown .5s cubic-bezier(.2,1,.3,1)}
.upd[hidden]{display:none}
.upd svg{flex:none;filter:drop-shadow(0 0 6px var(--accent))}
.upd button{flex:none;font:600 13px var(--title);letter-spacing:.05em;color:#1c1405;border:1px solid var(--g3);border-radius:999px;padding:7px 16px;cursor:pointer;background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3))}
@keyframes slidedown{from{transform:translateY(-100%)}}
</style>
</head>
<body data-t="mordor">
<div class="upd" id="upd" hidden role="alert">
  <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/></svg>
  <span>Hay una actualización disponible</span>
  <button id="updbtn">Actualizar</button>
</div>
<svg width="0" height="0" style="position:absolute"><symbol id="orn" viewBox="0 0 150 14"><path d="M0 7H56M94 7H150"/><path class="lf" d="M60 7Q66 0 72 7Q66 14 60 7Z"/><path d="M75 2L80 7L75 12L70 7Z"/><path class="lf" d="M78 7Q84 0 90 7Q84 14 78 7Z"/></symbol></svg>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="doom" aria-hidden="true"></div>
<svg class="mtn" viewBox="0 0 400 170" preserveAspectRatio="none" aria-hidden="true">
  <path class="far" d="M0,170V95L28,80L52,98L88,62L118,92L150,74L186,104L226,66L258,96L296,70L330,100L350,48L362,40L376,50L388,92L400,84V170Z"/>
  <path class="near" d="M0,170V128L40,104L72,130L112,96L152,132L202,108L244,136L292,104L334,134L372,112L400,126V170Z"/>
</svg>
<main>
  <header class="hero">
    <div class="ring" id="ring" role="img" aria-label="El Anillo Único">
      <svg viewBox="0 0 200 200"><defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset=".5" style="stop-color:var(--g2)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient>
        <path id="c" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0"/></defs>
        <circle cx="100" cy="100" r="87" fill="none" stroke="url(#g)" stroke-width="9"/>
        <circle cx="100" cy="100" r="56" fill="none" stroke="url(#g)" stroke-width="5"/>
        <g class="rt"><text font-family="Cinzel,Georgia,serif" font-size="15" font-weight="600" letter-spacing="3.4" fill="#e8731c"><textPath href="#c">ash nazg durbatulûk · ash nazg gimbatul · ash nazg thrakatulûk ·</textPath></text></g>
      </svg>
    </div>
    <h1>La Misión del Día</h1>
    <p class="date" id="date"></p>
    <svg class="orn"><use href="#orn"/></svg>
  </header>

  <section class="journey" aria-label="Progreso del día">
    <p class="jt" id="jt">EL CAMINO A LA MONTAÑA DEL DESTINO</p>
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <span class="stop" style="left:0"><b>Comarca</b></span>
      <span class="stop" style="left:25%"><b>Rivendel</b></span>
      <span class="stop" style="left:50%"><b>Moria</b></span>
      <span class="stop" style="left:75%"><b>Lórien</b></span>
      <span class="stop" style="left:100%"><b>Mordor</b></span>
      <span class="token" id="token"></span>
    </div>
  </section>

  <form id="form" autocomplete="off">
    <input id="in" maxlength="140" placeholder="Escribe tu misión, viajero…" aria-label="Nueva misión">
    <button class="seal-btn" aria-label="Inscribir misión">+</button>
  </form>
  <svg class="orn"><use href="#orn"/></svg>

  <div class="tabs" role="tablist">
    <button class="tab" data-f="all" aria-selected="true">Todas</button>
    <button class="tab" data-f="open" aria-selected="false">Pendientes</button>
    <button class="tab" data-f="done" aria-selected="false">Cumplidas</button>
  </div>
  <ul id="list" aria-live="polite"></ul>
  <div class="foot"><span id="count"></span><button class="link" id="clr">Borrar cumplidas</button></div>

  <div class="realms"><span>Reino</span>
    <button data-t="mordor" aria-pressed="true">Mordor</button>
    <button data-t="lorien" aria-pressed="false">Lórien</button>
    <button data-t="gondor" aria-pressed="false">Gondor</button>
  </div>
<p class="ver">Versión <span id="ver"></span></p>
</main>

<div class="win" id="win" hidden role="dialog" aria-modal="true" aria-label="Misión cumplida">
<div class="vol" id="vol" aria-hidden="true"></div>
<div class="pop">
  <div class="sh l" style="--d:.25s" aria-hidden="true"><svg viewBox="0 0 68 68">
    <circle cx="34" cy="34" r="32" fill="#0b0b0e" stroke="#d4a72c" stroke-width="3"/><circle cx="34" cy="34" r="27" fill="none" stroke="#d4a72c" stroke-opacity=".5"/>
    <g stroke="#f4f1e6" stroke-linecap="round" fill="none"><path d="M34,53V30" stroke-width="2.8"/><path d="M34,41L26,33M34,41L42,33M34,35L29,28M34,35L39,28" stroke-width="1.8"/></g>
    <g fill="#f4f1e6"><circle cx="25" cy="32" r="2"/><circle cx="43" cy="32" r="2"/><circle cx="28" cy="27" r="2"/><circle cx="40" cy="27" r="2"/><circle cx="34" cy="26" r="2.2"/></g>
    <path d="M28,22L29,16.5L31.5,19.5L34,14L36.5,19.5L39,16.5L40,22Z" fill="#d4a72c"/></svg></div>
  <div class="sh r" style="--d:.4s" aria-hidden="true"><svg viewBox="0 0 68 68">
    <circle cx="34" cy="34" r="32" fill="#2f5d2b" stroke="#d4a72c" stroke-width="3"/><circle cx="34" cy="34" r="27" fill="none" stroke="#d4a72c" stroke-opacity=".5"/>
    <g transform="translate(17,15) scale(.85)"><path d="M24,2L27,10Q36,16 38,30L38,44L26,44Q27,34 20,30Q14,36 8,36Q4,34 6,29Q9,24 14,22Q15,14 20,9Z" fill="#f4f1e6"/><circle cx="17" cy="19" r="1.5" fill="#2f5d2b"/></g></svg></div>
  <svg class="vscene" viewBox="0 0 360 150" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090c1a"/><stop offset=".7" stop-color="#241631"/><stop offset="1" stop-color="#4a2016"/></linearGradient>
      <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0"/><stop offset="1" stop-color="#ff7a2c" stop-opacity=".6"/></linearGradient>
    </defs>
    <rect width="360" height="150" fill="url(#sky)"/>
    <g id="stars"></g>
    <circle cx="296" cy="30" r="22" fill="#f1e8cf" opacity=".12"/><circle cx="296" cy="30" r="11" fill="#f1e8cf"/>
    <path d="M0,150V92L30,80L55,96L90,70L125,94L160,76L200,98L235,72L270,96L305,78L340,92L360,84V150Z" fill="#1d1a2b"/>
    <rect class="hz" y="60" width="360" height="90" fill="url(#wm)"/>
    <path d="M0,150V116Q60,106 120,114T240,112T360,110V150Z" fill="#07060a"/>
    <g id="arrows"></g>
  </svg>
  <div class="pc">
    <h2 class="vh">¡Misión cumplida!</h2>
    <svg class="orn" aria-hidden="true"><use href="#orn"/></svg>
    <p class="vs">Todas las tareas del día están completadas.<i>Gondor y Rohan cabalgan juntos: la jornada es vuestra.</i></p>
  </div>
  <div class="drain"></div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const KEY='lotr-todo-v1',APP_VERSION='2';
let tasks=[];try{tasks=(JSON.parse(localStorage.getItem(KEY))||[]).map(x=>({id:x.id,t:x.text!==undefined?x.text:x.t,d:(x.done!==undefined?x.done:x.d)?1:0}))}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks.map(x=>({id:x.id,text:x.t,done:!!x.d}))))}catch(e){}}
let filter='all',fresh=null,nid=Date.now();
$('#date').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pulse(){const r=$('#ring');r.classList.remove('flare');void r.offsetWidth;r.classList.add('flare')}
$('#ring').onclick=pulse;
function render(){save();$('#clr').style.visibility=tasks.some(x=>x.d)?'visible':'hidden';
  const s=tasks.filter(x=>filter==='all'||(filter==='done')===!!x.d);
  $('#list').innerHTML=s.length?s.map(x=>`<li class="${x.d?'done':''}${x.id===fresh?' fresh':''}" data-id="${x.id}"><button class="seal" aria-label="Sellar misión" aria-pressed="${!!x.d}"></button><span class="txt">${esc(x.t)}</span><button class="del" aria-label="Eliminar">×</button></li>`).join(''):`<li class="empty" style="display:block;background:none;box-shadow:none;animation:none;color:var(--dim)">La Comarca está en calma.<br>Inscribe tu primera misión.</li>`;
  document.querySelectorAll('.empty').forEach(e=>e.style.setProperty('--x',0));
  const d=tasks.filter(x=>x.d).length,p=tasks.length?d/tasks.length*100:0;
  $('#fill').style.width=p+'%';$('#token').style.left=p+'%';
  document.querySelectorAll('.stop').forEach((e,i)=>e.classList.toggle('on',p>=i*25&&(p>0||i===0)));
  $('#count').textContent=tasks.length?`${d} de ${tasks.length} cumplidas`:'';
  $('#jt').textContent=p===100&&tasks.length?'LA MISIÓN HA CONCLUIDO. EL ANILLO ESTÁ A SALVO.':'EL CAMINO A LA MONTAÑA DEL DESTINO';
}
$('#form').onsubmit=e=>{e.preventDefault();const v=$('#in').value.trim();if(!v)return;tasks.unshift({id:nid++,t:v,d:0});$('#in').value='';fresh=null;render();pulse()};
$('#list').onclick=e=>{const li=e.target.closest('li[data-id]');if(!li)return;const t=tasks.find(x=>x.id==li.dataset.id);
  if(e.target.closest('.seal')){t.d=t.d?0:1;fresh=t.d?t.id:null;if(t.d){pulse();burst(e.clientX,e.clientY)}render();if(t.d&&tasks.every(x=>x.d))setTimeout(victory,1300)}
  else if(e.target.closest('.del')){li.classList.add('gone');setTimeout(()=>{tasks=tasks.filter(x=>x.id!=t.id);render()},380)}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));fresh=null;render()});
document.querySelectorAll('.realms button').forEach(b=>b.onclick=()=>{document.body.dataset.t=b.dataset.t;document.querySelectorAll('.realms button').forEach(x=>x.setAttribute('aria-pressed',x===b));setTimeout(()=>{rgb=getComputedStyle(document.body).getPropertyValue('--ember').trim()},50)});

/* Brasas */
const cv=$('#embers'),cx=cv.getContext('2d');let W,H,P=[],rgb='232,115,28';
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',size);size();
function spawn(x,y,b){P.push({x,y,vx:(Math.random()-.5)*(b?5:.6),vy:b?-Math.random()*4-1:-Math.random()*.7-.25,r:Math.random()*1.8+.6,l:1,dc:b?.018:.0025+Math.random()*.003})}
function burst(x,y){if(!calm)for(let i=0;i<28;i++)spawn(x,y,1)}
(function loop(){cx.clearRect(0,0,W,H);if(!calm&&P.length<45&&Math.random()<.12)spawn(Math.random()*W,H+6,0);
  P=P.filter(p=>p.l>0&&p.y>-10);
  for(const p of P){p.x+=p.vx+Math.sin(p.y/40)*.25;p.y+=p.vy;p.l-=p.dc;p.vy+=p.g||0;const c=p.c||rgb;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fillStyle=`rgba(${c},${Math.max(p.l,0)*.85})`;cx.shadowColor=`rgba(${c},.9)`;cx.shadowBlur=8;cx.fill()}
  requestAnimationFrame(loop)})();
/* Victoria */
let fwt;
function fw(x,y){if(calm)return;const cs=['246,221,138','255,255,255','232,115,28','188,214,242'],c=cs[Math.random()*4|0];for(let i=0;i<46;i++){const a=6.283*i/46,s=2+Math.random()*2.6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.6+Math.random(),l:1,dc:.012,g:.045,c})}}
const rnd=n=>{const x=Math.sin(n*127.1)*43758.5;return x-Math.floor(x)};
let wt;
(function(){
$('#arrows').innerHTML=Array.from({length:16},(_,i)=>{const x=14+i*21.5+rnd(i)*8,y=120+rnd(i+9)*20,a=-18+rnd(i+3)*8,d=(.2+i*.07+rnd(i+5)*.12).toFixed(2);
return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${a.toFixed(1)})"><g class="fall" style="--d:${d}s"><g class="stk" style="--d:${d}s"><line class="tr" y1="-26" y2="-96"/><path d="M0,0V-24" stroke="#cdbb8e" stroke-width="1.5"/><path d="M0,3L-2.4,-4H2.4Z" fill="#cfd3da"/><path d="M0,-24L-3,-31L0,-27.5L3,-31Z" fill="#eadcb4"/></g></g></g>`}).join('');
$('#stars').innerHTML=Array.from({length:18},(_,i)=>`<circle class="tw" cx="${(i*47+13)%350+5}" cy="${(i*29+7)%62+6}" r="${i%4?.8:1.3}" fill="#fff" style="--d:${(i%6)*.5}s"/>`).join('');
$('#vol').innerHTML=Array.from({length:26},(_,i)=>`<i style="left:${(i*37%120)-20}%;--d:${(.12+rnd(i+40)*1.1).toFixed(2)}s;--t:${(.55+rnd(i+60)*.35).toFixed(2)}s;height:${50+(rnd(i+80)*50|0)}px"></i>`).join('')})();
function victory(){const w=$('#win');clearTimeout(wt);w.classList.remove('on','out');w.hidden=false;void w.offsetWidth;w.classList.add('on');wt=setTimeout(endWin,4000)}
function endWin(){const w=$('#win');if(w.hidden||w.classList.contains('out'))return;clearTimeout(wt);w.classList.add('out');setTimeout(()=>{w.hidden=true;w.classList.remove('on','out')},500)}
addEventListener('keydown',e=>{if(e.key==='Escape')endWin()});$('#win').addEventListener('click',endWin);
$('#ver').textContent=APP_VERSION;
$('#clr').onclick=()=>{if(!confirm('¿Borrar todas las misiones cumplidas?'))return;tasks=tasks.filter(x=>!x.d);fresh=null;render()};
document.querySelectorAll('.realms button').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('lotr-theme',b.dataset.t)}catch(e){}}));
try{const th=localStorage.getItem('lotr-theme'),b=th&&document.querySelector('.realms button[data-t="'+th+'"]');if(b)b.click()}catch(e){}

/* Actualizaciones */
let updating=false;
function showUpdate(w){const u=$('#upd'),btn=$('#updbtn');u.hidden=false;
  btn.onclick=()=>{updating=true;btn.disabled=true;btn.textContent='Actualizando…';w.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),4000)}}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload()});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw)nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw)})});
    const chk=()=>reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});
    setInterval(chk,30*60*1000);
  }).catch(()=>{}));
}
render();
</script>
</body>
</html>
