<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Misión del Día</title>
<meta name="theme-color" content="#0c0e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Misión">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0c0e0b; --moss:#1b2418; --bark:#2a2117; --parch:#eadcb4; --parch-dim:#a89a74;
  --gold:#d4a72c; --gold-hi:#f6dd8a; --ember:#e8731c; --blood:#9b2d20;
  --display:'Cinzel Decorative','Cinzel',Georgia,serif;
  --title:'Cinzel',Georgia,serif;
  --body:'IM Fell English','Palatino Linotype',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(ellipse at 50% -10%,#2b2a14 0%,transparent 55%),
    radial-gradient(ellipse at 50% 120%,#1d1308 0%,transparent 50%),
    var(--night);
  color:var(--parch);font-family:var(--body);font-size:19px;line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 18px 60px}

/* ----- El Anillo ----- */
.hero{text-align:center;padding-top:6px}
.ring-wrap{width:168px;height:168px;margin:0 auto 4px;position:relative;cursor:pointer;
  filter:drop-shadow(0 0 14px rgba(232,115,28,.45));animation:glow 4.5s ease-in-out infinite}
.ring-wrap svg{width:100%;height:100%;overflow:visible}
.ring-text{transform-origin:100px 100px;animation:spin 60s linear infinite}
.ring-wrap.pulse{animation:flare .9s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px rgba(232,115,28,.35))}50%{filter:drop-shadow(0 0 26px rgba(246,221,138,.7))}}
@keyframes flare{0%{transform:scale(1)}30%{transform:scale(1.14);filter:drop-shadow(0 0 40px #fff3b0)}100%{transform:scale(1)}}
h1{font-family:var(--display);font-size:clamp(26px,8vw,36px);margin:6px 0 2px;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#8a6a14);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{font-family:var(--title);font-size:14px;letter-spacing:.14em;color:var(--parch-dim);margin:0}
.verse{font-style:italic;color:var(--parch-dim);margin:10px 0 0;min-height:2.9em;font-size:17px;transition:opacity .6s}

.rule{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.rule i{width:8px;height:8px;border:1px solid var(--gold);transform:rotate(45deg)}

/* ----- Entrada ----- */
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;background:rgba(42,33,23,.75);border:1px solid #5b4a2a;border-radius:3px;
  color:var(--parch);font:inherit;padding:13px 14px;outline:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.6);transition:border-color .25s,box-shadow .25s}
input::placeholder{color:#7d704f;font-style:italic}
input:focus{border-color:var(--gold);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 0 14px rgba(212,167,44,.35)}
.btn{font-family:var(--title);font-weight:600;letter-spacing:.06em;color:#1a1305;border:1px solid #7a5d12;border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#a37d17);padding:0 18px;font-size:15px;
  box-shadow:0 2px 0 #5a430b,0 4px 14px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s,filter .2s}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #5a430b}
.btn:focus-visible,.tab:focus-visible,.check:focus-visible,.del:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ----- Pestañas ----- */
.tabs{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--parch-dim);font-family:var(--title);font-size:14px;letter-spacing:.08em;padding:8px 12px;cursor:pointer;transition:color .2s,border-color .2s}
.tab[aria-selected=true]{color:var(--gold-hi);border-color:var(--gold)}

/* ----- Tareas: pergaminos ----- */
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:3px;
  background:linear-gradient(135deg,#3a2e1c,#2a2117 70%);border:1px solid #5b4a2a;border-left:3px solid var(--gold);
  box-shadow:0 3px 12px rgba(0,0,0,.5);transform-origin:top;animation:unroll .45s cubic-bezier(.2,.8,.3,1)}
li.leaving{animation:vanish .4s forwards}
@keyframes unroll{from{opacity:0;transform:scaleY(.2) translateY(-10px)}to{opacity:1;transform:none}}
@keyframes vanish{to{opacity:0;transform:translateX(60px) scale(.96);height:0;padding:0;margin:-5px 0}}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle,#1b1408,#0c0a05);cursor:pointer;position:relative;transition:box-shadow .3s}
.check::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid var(--gold-hi);box-shadow:0 0 10px var(--ember);transform:scale(0);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
li.done .check{box-shadow:0 0 14px rgba(246,221,138,.6)}
li.done .check::after{transform:scale(1);opacity:1}
.txt{flex:1;min-width:0;overflow-wrap:anywhere;position:relative;transition:color .3s}
li.done{border-left-color:#5c6b3a}
li.done .txt{color:#8c8160}
li.done .txt{text-decoration:line-through;text-decoration-color:var(--blood);text-decoration-thickness:2px}
.del{flex:none;background:none;border:0;color:#7d6a45;font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;transition:color .2s}
.del:hover{color:var(--blood)}

.empty{text-align:center;color:var(--parch-dim);font-style:italic;padding:26px 10px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--parch-dim);font-size:16px}
.link{background:none;border:0;color:var(--parch-dim);font:inherit;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.link:hover{color:var(--gold-hi)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:5;
  background:#1b1408;border:1px solid var(--gold);color:var(--gold-hi);padding:10px 18px;border-radius:3px;font-family:var(--title);font-size:14px;
  transition:.4s;pointer-events:none;text-align:center;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<main>
  <header class="hero">
    <div class="ring-wrap" id="ring" role="img" aria-label="El Anillo Único">
      <svg viewBox="0 0 200 200">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#d4a72c"/><stop offset="1" stop-color="#7a5a0e"/>
          </linearGradient>
          <path id="circ" d="M100,100 m-70,0 a70,70 0 1,1 140,0 a70,70 0 1,1 -140,0"/>
        </defs>
        <circle cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="9"/>
        <circle cx="100" cy="100" r="56" fill="none" stroke="url(#g)" stroke-width="5"/>
        <circle cx="100" cy="100" r="86" fill="none" stroke="#3b2a05" stroke-width="1" opacity=".6"/>
        <g class="ring-text">
          <text font-family="Cinzel,Georgia,serif" font-size="15" fill="#e8731c" letter-spacing="3.4" font-weight="600">
            <textPath href="#circ">ash nazg durbatulûk · ash nazg gimbatul · ash nazg thrakatulûk ·</textPath>
          </text>
        </g>
      </svg>
    </div>
    <h1>La Misión del Día</h1>
    <p class="date" id="date"></p>
    <p class="verse" id="verse"></p>
  </header>

  <div class="rule"><i></i></div>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="¿Qué debe cumplirse hoy?" maxlength="140" aria-label="Nueva misión">
    <button class="btn" type="submit">Inscribir</button>
  </form>

  <div class="rule"><i></i></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-f="all" aria-selected="true">Todas</button>
    <button class="tab" role="tab" data-f="open" aria-selected="false">Pendientes</button>
    <button class="tab" role="tab" data-f="done" aria-selected="false">Cumplidas</button>
  </div>

  <ul id="list" aria-live="polite"></ul>

  <div class="foot">
    <span id="count"></span>
    <button class="link" id="clear">Borrar cumplidas</button>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'lotr-todo-v1';
let tasks = [], filter = 'all';
try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ tasks = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){} };

/* Fecha */
const d = new Date();
$('#date').textContent = d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();

/* Frases rotativas (originales, con aire de la Tierra Media) */
const verses = [
  'Hasta el camino más largo empieza en tu puerta.',
  'Un paso hoy; la Montaña del Destino espera.',
  'No olvides lo pequeño: de ello se sostienen las grandes gestas.',
  'La luz de Eärendil te guíe en la jornada.',
  'Quien anota su misión ya la ha medio cumplido.',
  'Hasta las hojas de Lórien se cuentan una a una.'
];
let vi = Math.floor(Math.random()*verses.length);
const verseEl = $('#verse');
function nextVerse(){ verseEl.style.opacity=0; setTimeout(()=>{ vi=(vi+1)%verses.length; verseEl.textContent=verses[vi]; verseEl.style.opacity=1; },600); }
verseEl.textContent = verses[vi]; setInterval(nextVerse, 12000);

/* Toast */
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

/* Anillo */
function pulse(){ const r=$('#ring'); r.classList.remove('pulse'); void r.offsetWidth; r.classList.add('pulse'); }
$('#ring').addEventListener('click', pulse);

/* Render */
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  const list = $('#list');
  const shown = tasks.filter(t => filter==='all' || (filter==='done') === t.done);
  list.innerHTML = shown.length ? shown.map(t => `
    <li class="${t.done?'done':''}" data-id="${t.id}">
      <button class="check" aria-label="Marcar como cumplida" aria-pressed="${t.done}"></button>
      <span class="txt">${esc(t.text)}</span>
      <button class="del" aria-label="Eliminar">×</button>
    </li>`).join('') :
    `<li class="empty" style="display:block;background:none;border:0;box-shadow:none;animation:none">${
      tasks.length ? 'Nada en esta lista, viajero.' : 'La Comarca está en calma.<br>Inscribe tu primera misión.'}</li>`;
  const done = tasks.filter(t=>t.done).length;
  $('#count').textContent = tasks.length ? `${done} de ${tasks.length} cumplidas` : '';
  $('#clear').style.visibility = done ? 'visible' : 'hidden';
}

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#input').value.trim(); if(!v) return;
  tasks.unshift({id: Date.now(), text: v, done:false});
  $('#input').value=''; save(); render(); pulse();
});

$('#list').addEventListener('click', e => {
  const li = e.target.closest('li[data-id]'); if(!li) return;
  const t = tasks.find(x => x.id == li.dataset.id);
  if (e.target.closest('.check')) {
    t.done = !t.done; save();
    if (t.done) { pulse(); burst(e.clientX, e.clientY);
      toast(tasks.every(x=>x.done) ? '¡La misión ha concluido! El Anillo está a salvo.' : 'Misión cumplida.'); }
    render();
  } else if (e.target.closest('.del')) {
    li.classList.add('leaving');
    setTimeout(()=>{ tasks = tasks.filter(x=>x.id!=t.id); save(); render(); }, 380);
  }
});

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x===b));
  render();
}));

$('#clear').addEventListener('click', () => {
  if(!confirm('¿Borrar todas las misiones cumplidas?')) return;
  tasks = tasks.filter(t=>!t.done); save(); render();
});

/* Brasas */
const cv = $('#embers'), cx = cv.getContext('2d'); let W,H,P=[];
function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
addEventListener('resize', size); size();
const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
function spawn(x,y,burst){
  P.push({x, y, vx:(Math.random()-.5)*(burst?5:.6), vy: burst ? -Math.random()*4-1 : -Math.random()*.7-.25,
    r: Math.random()*1.8+.6, life:1, decay: burst?.018:.0025+Math.random()*.003, hue: 28+Math.random()*22});
}
function burst(x,y){ if(calm) return; for(let i=0;i<26;i++) spawn(x,y,true); }
function loop(){
  cx.clearRect(0,0,W,H);
  if(!calm && P.length<45 && Math.random()<.12) spawn(Math.random()*W, H+6, false);
  P = P.filter(p=>p.life>0 && p.y>-10);
  for(const p of P){
    p.x += p.vx + Math.sin(p.y/40)*.25; p.y += p.vy; p.life -= p.decay;
    if(p.vy>-6) p.vy += .0; 
    cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283);
    cx.fillStyle = `hsla(${p.hue},95%,60%,${Math.max(p.life,0)*.85})`;
    cx.shadowColor = `hsla(${p.hue},100%,55%,.9)`; cx.shadowBlur = 8; cx.fill();
  }
  requestAnimationFrame(loop);
}
loop(); render();

/* PWA */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
